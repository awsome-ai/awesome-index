name: Update Awesome Data

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch root and recursive readmes
        run: node fetch-readmes.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build data
        run: node build-data.js
      - name: Commit
        run: |
          git config user.name "awesome-index-bot"
          git config user.email "bot@awesome-index"
          git add awesome-readme.md awesome-readmes.json awesome-repos.json awesome-tree.json awesome-index.json awesome-stats.json awesome-data-slim.json data/chunks index.html fetch-readmes.js build-data.js .gitignore
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "📊 Weekly data update $(date +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
          fi
